version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      # メジャーも含めて1本の PR にまとめ、CI の実行回数とレビュー回数を減らす
      actions-all:
        patterns:
          - "*"
